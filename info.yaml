# Tiny Tapeout project information
project:
  title:        "CardMCU C0"
  author:       "Derry"
  discord:      ""
  description:  "8-bit CardMCU ASIC prototype with GPIO, UART, SPI and timer"
  language:     "Verilog"
  clock_hz:     10000000

  # Start with one tile. If the design does not fit, increase later.
  tiles: "1x1"

  top_module:  "tt_um_derrykervin_cardmcu_c0"

  source_files:
    - "project.v"
    - "card.v"
    - "card_cpu.v"
    - "program_rom.v"
    - "uart_tx.v"
    - "uart_rx.v"
    - "spi_master.v"

pinout:
  # Dedicated inputs: GPIO input bus
  ui[0]: "GPIO_IN0"
  ui[1]: "GPIO_IN1"
  ui[2]: "GPIO_IN2"
  ui[3]: "GPIO_IN3"
  ui[4]: "GPIO_IN4"
  ui[5]: "GPIO_IN5"
  ui[6]: "GPIO_IN6"
  ui[7]: "GPIO_IN7"

  # Dedicated outputs: GPIO output bus
  uo[0]: "GPIO_OUT0"
  uo[1]: "GPIO_OUT1"
  uo[2]: "GPIO_OUT2"
  uo[3]: "GPIO_OUT3"
  uo[4]: "GPIO_OUT4"
  uo[5]: "GPIO_OUT5"
  uo[6]: "GPIO_OUT6"
  uo[7]: "GPIO_OUT7"

  # Peripheral pins
  uio[0]: "UART_RX"
  uio[1]: "UART_TX"
  uio[2]: "SPI_MISO"
  uio[3]: "SPI_SCLK"
  uio[4]: "SPI_MOSI"
  uio[5]: "SPI_CS_N"
  uio[6]: ""
  uio[7]: ""

yaml_version: 6
